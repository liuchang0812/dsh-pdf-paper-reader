name: checks

on:
  push:
  pull_request:

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Host routes and agent tools
        run: node dev/route-check.mjs

  client-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - name: Install dev dependencies
        working-directory: dev
        run: npm ci
      - name: Client render smoke test
        working-directory: dev
        run: node ssr-check.mjs
      - name: jsdom integration test
        working-directory: dev
        run: node dom-check.mjs
